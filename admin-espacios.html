<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoSpace | Gestión de espacios</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin-espacios.css"></head>
<body><div class="admin-shell"><aside class="admin-sidebar"><a class="admin-logo" href="admin.html"><span>C</span>CoSpace</a><nav><a href="admin.html">⌂ <b>Dashboard</b></a><a class="active" data-section="spaces" href="#spaces">▦ <b>Espacios</b></a><a data-section="bookings" href="#bookings">▣ <b>Reservas</b></a><a data-section="users" href="#users">♙ <b>Usuarios</b></a><a data-section="payments" href="#payments">▤ <b>Pagos</b></a><a href="admin.html">⚙ <b>Configuración</b></a></nav><div class="admin-footer">♢ <span><strong>Panel de administrador</strong><small>Gestiona todo el sistema<br>de CoSpace.</small></span></div></aside><main class="admin-main"><header class="admin-top"><input class="top-search" placeholder="⌕  Buscar espacios, usuarios, reservas..." type="search"><div class="top-user">♧ <i>LG</i><b>Admin CoSpace</b>⌄</div></header><div class="admin-content"><div class="page-heading"><div><h1 id="page-title">Gestión de espacios</h1><p id="page-subtitle">Administra los espacios de coworking, su disponibilidad y estado.</p></div><button class="primary-button" id="add-space">＋ &nbsp;Agregar espacio</button></div><div id="section-content"></div></div></main></div><div class="modal" id="space-modal"><form class="modal-card" id="space-form"><button class="modal-close" type="button" id="close-modal">×</button><h2 id="modal-title">Agregar espacio</h2><div class="form-grid"><label>Nombre del espacio<input id="form-name" required></label><label>Sede<select id="form-sede" required></select></label><label>Tipo<select id="form-type"><option value="desk">Escritorio flexible</option><option value="office">Oficina privada</option><option value="meeting">Sala de reunión</option></select></label><label>Capacidad<input id="form-capacity" type="number" min="1" required></label><label>Precio por hora<input id="form-price" type="number" min="0" required></label><label>Precio por día<input id="form-day-price" type="number" min="0"></label><label>Estado<select id="form-status"><option value="active">Activo</option><option value="maintenance">En mantenimiento</option><option value="inactive">Inactivo</option></select></label><label>Foto<input id="form-photo" type="text" placeholder="foto.jpg"></label></div><p class="form-error" id="form-error"></p><div class="modal-actions"><button class="secondary-button" type="button" id="cancel-modal">Cancelar</button><button class="primary-button" type="submit">Guardar espacio</button></div></form></div><div class="toast" id="toast"></div><script src="admin-espacios.js"></script></body></html>
